<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letra animada 💖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px 16px;
    background: radial-gradient(circle at 50% 30%, #3b0a14, #12020a 70%);
    overflow-x: hidden;
    overflow-y: auto;
    font-family: Georgia, serif;
    color: #ffc2d9;
  }

  #palco {
    position: relative;
    z-index: 2;
    width: min(92vw, 720px);
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .linha {
    display: none;
    font-size: clamp(26px, 5vw, 46px);
    line-height: 1.4;
    text-shadow: 0 0 12px rgba(255, 60, 110, .8), 0 0 30px rgba(255, 30, 90, .5);
  }
  .linha.ativa { display: block; }

  .palavra {
    display: inline-block;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0 .12em;
  }
  .palavra.vis {
    opacity: 1;
    transform: translateY(0);
  }

  #pedido-area {
    position: relative;
    z-index: 2;
    width: min(92vw, 460px);
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: -8px;
  }
  #pedido-area .anel-caixa {
    visibility: hidden;
    pointer-events: none;
  }
  #pedido-area .anel-caixa.mini {
    visibility: visible;
    pointer-events: auto;
  }

  #botoes-resposta {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  #botoes-resposta button,
  #controles button {
    padding: 10px 26px;
    font-size: 16px;
    border: 0;
    border-radius: 30px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #c1121f, #8f1024);
    box-shadow: 0 0 16px rgba(230, 57, 70, .45);
    transition: transform .2s, box-shadow .2s;
  }
  #botoes-resposta button:hover,
  #controles button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(255, 100, 140, .7);
  }
  #botoes-resposta button:first-child {
    background: linear-gradient(135deg, #d4af37, #9b7115);
  }
  #botoes-resposta button:last-child {
    background: linear-gradient(135deg, #76243a, #4c1425);
  }

  #controles {
    position: relative;
    z-index: 2;
    margin-top: 2px;
    text-align: center;
  }
  #resposta {
    min-height: 24px;
    margin-top: 10px;
    font-size: 15px;
    color: #ffe2ad;
    text-shadow: 0 0 10px #c1121f;
  }

  .coracao {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    animation: flutuar linear forwards;
  }
  @keyframes flutuar {
    0% { opacity: 0; transform: translateY(0) scale(.5) rotate(-10deg); }
    25% { opacity: .9; }
    70% { opacity: .7; }
    100% { opacity: 0; transform: translateY(-80px) scale(1.15) rotate(10deg); }
  }

  /* Caixa de alianças */
  #carta {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #3b0a14, #12020a 70%);
    transition: opacity .8s, visibility .8s;
  }
  #carta.oculta {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .anel-caixa {
    --escala: 1;
    position: relative;
    width: 220px;
    height: 195px;
    transform: scale(var(--escala));
    transform-origin: center;
    cursor: pointer;
    animation: flutuarEnvelope 3s ease-in-out infinite;
    transition: transform 1s cubic-bezier(.2, .8, .2, 1);
    filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .45));
  }
  @keyframes flutuarEnvelope {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -9px; }
  }

  .caixa-base {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 4px;
    height: 112px;
    border: 1px solid #ff9a9e;
    border-radius: 16px 16px 24px 24px;
    background: linear-gradient(145deg, #f34754, #bd1029 45%, #720b20);
    box-shadow: inset 0 5px 12px #ff9a9e66, inset 0 -12px 18px #38000e99;
  }
  .caixa-base::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid #ffc5a055;
    border-radius: 10px 10px 18px 18px;
  }

  .interior {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 32px;
    height: 72px;
    border-radius: 50% 50% 15px 15px;
    background: radial-gradient(ellipse, #24040d, #500a1a 72%);
    box-shadow: inset 0 5px 12px #100007;
  }

  .anel {
    position: absolute;
    left: 50%;
    bottom: 48px;
    width: 49px;
    height: 49px;
    border: 7px solid #f5d77d;
    border-bottom-color: #b88625;
    border-radius: 50%;
    transform: translateX(-50%) rotate(-12deg);
    opacity: 0;
    filter: drop-shadow(0 0 8px #ffd96b);
    transition: opacity .6s .25s, transform .8s .2s;
  }
  .anel::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    left: 11px;
    top: -13px;
    background: linear-gradient(135deg, #fff8cc, #e7b83f 65%, #fff1ae);
    transform: rotate(45deg);
    border-radius: 3px;
    box-shadow: 0 0 12px #ffe782;
  }

  .tampa {
    position: absolute;
    left: 8px;
    right: 8px;
    top: 18px;
    height: 87px;
    z-index: 2;
    border: 1px solid #ffb0a2;
    border-radius: 19px 19px 12px 12px;
    background: linear-gradient(135deg, #ff5260, #c51430 58%, #810b24);
    transform-origin: bottom;
    transition: transform .85s cubic-bezier(.2, .8, .2, 1);
    box-shadow: inset 0 5px 10px #ffb7a266, inset 0 -5px 9px #60001588, 0 9px 12px #26000b66;
  }
  .tampa::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid #ffd28b88;
    border-radius: 12px 12px 7px 7px;
  }

  .lacinho {
    position: absolute;
    left: 50%;
    top: 49px;
    z-index: 3;
    width: 34px;
    height: 30px;
    transform: translateX(-50%);
    transition: opacity .3s;
  }
  .lacinho::before,
  .lacinho::after {
    content: "";
    position: absolute;
    top: 2px;
    width: 17px;
    height: 22px;
    border: 2px solid #f8dc9a;
    border-radius: 70% 35% 70% 35%;
    background: linear-gradient(135deg, #ffe6aa, #be8b39);
  }
  .lacinho::before {
    right: 15px;
    transform: rotate(-25deg);
  }
  .lacinho::after {
    left: 15px;
    transform: scaleX(-1) rotate(-25deg);
  }

  .anel-caixa.aberta .tampa {
    transform: rotateX(125deg) translateY(-6px);
  }
  .anel-caixa.aberta .lacinho { opacity: 0; }
  .anel-caixa.aberta .anel {
    opacity: 1;
    transform: translateX(-50%) rotate(0) translateY(-3px);
  }

  .pergunta {
    position: absolute;
    width: 280px;
    left: 50%;
    top: -72px;
    transform: translateX(-50%) translateY(8px);
    text-align: center;
    color: #ffe6bc;
    font-size: 18px;
    line-height: 1.35;
    opacity: 0;
    transition: opacity .6s .4s, transform .6s .4s;
    text-shadow: 0 2px 12px #ff315b;
    pointer-events: none;
  }
  .anel-caixa.aberta .pergunta {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .anel-caixa.mini {
    --escala: .62;
    animation: none;
  }
  #carta .dica {
    position: absolute;
    bottom: 38px;
    color: #ffc2d9;
    font-style: italic;
    font-size: 15px;
    opacity: .85;
  }
  .dica.escondida {
    opacity: 0;
    transition: opacity .3s;
  }

  @media (max-height: 650px) {
    body { justify-content: flex-start; }
    #palco { min-height: 160px; }
    .anel-caixa.mini { --escala: .52; }
  }
</style>
</head>
<body>

<div id="carta">
  <div class="anel-caixa" id="anelCaixa" role="button" tabindex="0" aria-label="Abrir a caixa de alianças">
    <div class="pergunta">Aceita se casar comigo ?</div>
    <div class="interior"></div>
    <div class="anel"></div>
    <div class="caixa-base"></div>
    <div class="tampa"></div>
    <div class="lacinho"></div>
  </div>
  <div class="dica" id="dica">toque na caixinha para abrir</div>
</div>

<div id="palco"></div>
<div id="pedido-area"></div>

<div id="controles">
  <div id="botoes-resposta">
    <button id="btnAceito" type="button">Aceito</button>
    <button id="btnDesculpa" type="button">Desculpa</button>
  </div>
  <button id="btnIniciar">Reiniciar</button>
  <div id="resposta" aria-live="polite"></div>
</div>

<script>
  // ==========================================================
  //  👇 EDITE AQUI 👇
  //  tempo: segundo (número) em que a linha começa
  //  texto: o que aparece na tela
  //  Os tempos precisam estar em ordem crescente.
  // ==========================================================
  const LINHAS = [
    { tempo: 3.5, texto: "O quarto meio escuro, a janela aberta" },
    { tempo: 5.5, texto: "A porta encostada, a Lua está tão bela" },
    { tempo: 9.5, texto: "E eu tô aqui sentindo falta de você" },
    { tempo: 13.5, texto: "Já vi todos os filmes, li todos os livros" },
    { tempo: 16.5, texto: "E tô esperando a próxima novela" },
    { tempo: 19.5, texto: "Tudo porque eu tô tentando te esquecer" },
    { tempo: 25.5, texto: "E em qualquer lugar que eu vou" },
    { tempo: 27.5, texto: "Onde você está, eu estou, oh ohoh oh ohoh" },
    { tempo: 34.5, texto: "O meu pensamento te segue" },
    { tempo: 36.5, texto: "Minha saudade te persegue" },
    { tempo: 39.5, texto: "O meu amor não envelhece" },
    { tempo: 41.5, texto: "Cê não sai da minha mente" },
    { tempo: 44.5, texto: "É que você me causa febre" },
    { tempo: 47.5, texto: "De uns 40 graus ou um pouco mais" },
    { tempo: 49.5, texto: "Eu quero é você, eu amo só você" },
    { tempo: 54.5, texto: "E o resto tanto faz, tanto faz" }
  ];

  const AUDIO_SRC = "ssstik.io_1794321796998.mp3";

  // Ajuste de sincronia em segundos (positivo = texto aparece mais cedo)
  const AJUSTE = 2;

  // Fração do tempo da linha em que as palavras terminam de aparecer
  const FATOR_DURACAO = 0.85;
  // ==========================================================

  const palco = document.getElementById("palco");
  const btn = document.getElementById("btnIniciar");
  const carta = document.getElementById("carta");
  const anelCaixa = document.getElementById("anelCaixa");
  const dica = document.getElementById("dica");
  const pedidoArea = document.getElementById("pedido-area");
  const resposta = document.getElementById("resposta");

  let caixaIniciada = false;

  function abrirCaixa() {
    if (caixaIniciada) return;
    caixaIniciada = true;
    anelCaixa.classList.add("aberta");
    dica.classList.add("escondida");

    setTimeout(() => {
      pedidoArea.appendChild(anelCaixa);
      requestAnimationFrame(() => anelCaixa.classList.add("mini"));
      carta.classList.add("oculta");
      btn.click();
    }, 1700);
  }

  anelCaixa.addEventListener("click", abrirCaixa);
  anelCaixa.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      abrirCaixa();
    }
  });

  document.getElementById("btnAceito").addEventListener("click", () => {
    resposta.textContent = "Meu coração já estava esperando por esse sim. 💍❤️";
  });
  document.getElementById("btnDesculpa").addEventListener("click", () => {
    resposta.textContent = "Tudo bem. Obrigado por ouvir essa canção comigo. ❤️";
  });

  const elementos = LINHAS.map(linha => {
    const div = document.createElement("div");
    div.className = "linha";
    const palavras = linha.texto.split(" ").filter(p => p.length);
    const spans = palavras.map(p => {
      const s = document.createElement("span");
      s.className = "palavra";
      s.textContent = p;
      div.appendChild(s);
      div.appendChild(document.createTextNode(" "));
      return s;
    });
    palco.appendChild(div);
    return { div, spans };
  });

  const audio = AUDIO_SRC ? new Audio(AUDIO_SRC) : null;
  let inicio = 0;
  let frameId = null;
  let usandoAudio = false;

  function tempoAtual() {
    const t = usandoAudio
      ? audio.currentTime
      : (performance.now() - inicio) / 1000;
    return t + AJUSTE;
  }

  function atualizar() {
    const t = tempoAtual();

    let ativo = -1;
    for (let i = 0; i < LINHAS.length; i++) {
      if (t >= LINHAS[i].tempo) ativo = i;
    }

    elementos.forEach((item, i) => {
      if (i === ativo) {
        item.div.classList.add("ativa");
        const fim = LINHAS[i + 1]
          ? LINHAS[i + 1].tempo
          : LINHAS[i].tempo + 4;
        const duracao = Math.max((fim - LINHAS[i].tempo) * FATOR_DURACAO, 0.1);
        const progresso = Math.min((t - LINHAS[i].tempo) / duracao, 1);
        const quantas = Math.ceil(progresso * item.spans.length);
        item.spans.forEach((s, j) => s.classList.toggle("vis", j < quantas));
      } else {
        item.div.classList.remove("ativa");
        item.spans.forEach(s => s.classList.remove("vis"));
      }
    });

    frameId = requestAnimationFrame(atualizar);
  }

  function iniciar() {
    cancelAnimationFrame(frameId);
    elementos.forEach(item => {
      item.div.classList.remove("ativa");
      item.spans.forEach(s => s.classList.remove("vis"));
    });

    inicio = performance.now();
    usandoAudio = false;

    if (audio) {
      audio.currentTime = 0;
      audio.play()
        .then(() => { usandoAudio = true; })
        .catch(() => {
          usandoAudio = false;
          inicio = performance.now();
          alert("Não consegui tocar o áudio. Confira o nome em AUDIO_SRC e se o arquivo está na mesma pasta.");
        });
    }

    btn.textContent = "Reiniciar";
    frameId = requestAnimationFrame(atualizar);
  }

  btn.addEventListener("click", iniciar);

  const simbolos = ["❤ Aline Prints", "💗", "💕 Aline Prints", "♥"];
  const cores = ["#ff4d88", "#ff80ab", "#ffc1d6", "#e0245e", "#ff1744"];

  function criarCoracao() {
    const c = document.createElement("div");
    c.className = "coracao";
    c.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
    c.style.left = (Math.random() * 90) + "vw";
    c.style.top = (Math.random() * 90) + "vh";
    c.style.fontSize = (16 + Math.random() * 28) + "px";
    c.style.color = cores[Math.floor(Math.random() * cores.length)];
    const duracao = 3 + Math.random() * 3;
    c.style.animationDuration = duracao + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), duracao * 1000);
  }

  setInterval(criarCoracao, 350);
</script>

</body>
</html>
