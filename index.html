<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para você</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --fundo: #080203;
      --vinho: #2a0509;
      --vermelho: #f23636;
      --vermelho-escuro: #a8071a;
      --vermelho-claro: #ff4949;
      --dourado: #ffd0a0;
      --texto: #fff4f2;
      --vidro: rgba(28, 4, 7, .76);
      --borda: rgba(255, 105, 105, .38);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--texto);
      background: radial-gradient(ellipse at 50% 38%, var(--vinho), var(--fundo) 72%);
      font-family: "Cormorant Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #galaxy {
      touch-action: pan-y;
      transition: filter 1.5s ease;
    }

    #galaxy.blur { filter: blur(9px) brightness(.68); }

    #warp {
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(.2,.75,.2,1);
    }

    #warp.on { opacity: 1; }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity 1.2s cubic-bezier(.2,.75,.2,1), visibility 1.2s;
    }

    .intro.hide { opacity: 0; visibility: hidden; }

    h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.8rem, 10vw, 5.4rem);
      font-weight: 400;
      text-shadow: 0 0 26px rgba(242, 54, 54, .75);
    }

    .intro p {
      margin: .6rem 0 1.7rem;
      color: #edc4c4;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      font-style: italic;
    }

    button {
      color: var(--texto);
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--dourado);
      outline-offset: 4px;
    }

    .entrar {
      border: 0;
      border-radius: 999px;
      padding: .9em 1.8em;
      background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
      box-shadow: 0 0 30px rgba(242, 54, 54, .58);
      font-size: 1.15rem;
      animation: pulsar 2.4s ease-in-out infinite;
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.055); }
    }

    .card {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(560px, calc(100% - 32px));
      padding: clamp(18px, 4vw, 28px);
      border: 1px solid var(--borda);
      border-radius: 22px;
      background: var(--vidro);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, 24px);
      transition: opacity 1s cubic-bezier(.2,.75,.2,1),
                  transform 1s cubic-bezier(.2,.75,.2,1),
                  visibility 1s;
    }

    .card.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .kicker {
      margin-bottom: 14px;
      color: var(--dourado);
      font: .8rem Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .versiculo {
      min-height: 100px;
      display: grid;
      place-items: center;
      opacity: 1;
      transition: opacity .35s ease, transform .35s ease;
    }

    .versiculo.trocando {
      opacity: 0;
      transform: translateY(8px);
    }

    .versiculo blockquote {
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
      font-style: italic;
      line-height: 1.35;
      text-wrap: balance;
    }

    .versiculo figcaption {
      margin-top: .8rem;
      color: var(--dourado);
      font: .78rem Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    .arrow {
      flex: 0 0 44px;
      height: 44px;
      border: 1px solid var(--borda);
      border-radius: 50%;
      background: rgba(255, 80, 80, .1);
      font-size: 1.6rem;
      transition: background .25s ease, transform .25s ease;
    }

    .arrow:hover {
      background: rgba(242, 54, 54, .3);
      transform: scale(1.06);
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 105, 105, .38);
      transition: transform .3s ease, background .3s ease;
    }

    .dot.on {
      background: var(--vermelho-claro);
      transform: scale(1.45);
    }

    .dica-rolagem {
      margin-top: 14px;
      color: #dcb2ad;
      font-size: .9rem;
      opacity: .82;
      animation: descer-dica 1.8s ease-in-out infinite;
    }

    @keyframes descer-dica {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* Segunda cena: pétalas e caixa de aliança */
    #aliancas {
      position: relative;
      z-index: 8;
      height: 320vh;
      margin-top: 100vh;
      overflow: visible;
      isolation: isolate;
      background: radial-gradient(ellipse at 50% 46%, #30070b 0%, #100205 58%, #050102 100%);
    }

    .aliancas-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      min-height: 560px;
      display: grid;
      place-items: center;
      overflow: hidden;
      z-index: 2;
      perspective: 1500px;
    }

    /* Ao terminar a animação, a cena permanece na tela em vez de desaparecer. */
    #aliancas.aliancas-finalizada .aliancas-sticky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      min-height: 0;
      z-index: 9;
    }

    .aliancas-titulo {
      position: absolute;
      z-index: 2;
      top: clamp(100px, 40vh, 180px);
      width: 100%;
      padding: 0 20px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 25px #d2182d88;
    }

    .aliancas-titulo h2 {
      color: #fff0ed;
      font: 400 clamp(2.5rem, 7vw, 4.8rem)/1.05 "Great Vibes", cursive;
    }

    .aliancas-titulo p {
      margin-top: 12px;
      color: #e7b9b4;
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      font-style: italic;
    }

    .petalas {
      position: absolute;
      inset: 0;
      z-index: 1;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .petala {
      position: absolute;
      top: -12vh;
      left: var(--left);
      width: var(--size);
      height: calc(var(--size) * .68);
      border-radius: 80% 8% 76% 12%;
      background: radial-gradient(ellipse at 28% 25%, #ff7771 0%, #d21b2c 46%, #720714 100%);
      box-shadow: inset 1px 1px 4px #ffb2a666, 0 2px 12px #8c071844;
      opacity: var(--opacity);
      filter: blur(var(--softness));
      animation: cair-petala var(--duration) var(--delay) linear infinite;
      will-change: transform;
    }

    @keyframes cair-petala {
      0% { transform: translate3d(0, -12vh, 0) rotate(0); }
      100% { transform: translate3d(var(--drift), 332vh, 0) rotate(var(--spin)); }
    }

    .caixa-movimento {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 53%;
      width: min(300px, 60vw);
      height: min(280px, 60vw);
      transform-style: preserve-3d;
      transform: translate3d(-50%, -50%, 0);
      will-change: transform;
      filter: drop-shadow(0 28px 34px #000b) drop-shadow(0 0 34px #8d101a44);
    }

    .caixa-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(8deg) rotateY(-2deg);
    }

    .interior-caixa {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 7%;
      height: 47%;
      border: 1px solid #b99868;
      border-radius: 12px 12px 20px 20px;
      background: linear-gradient(145deg, #171513, #050505 65%, #211c16);
      box-shadow: inset 0 8px 14px #000, inset 0 0 0 5px #ffffff08;
      transform: translateZ(4px);
    }

    .forro {
      position: absolute;
      inset: 8px 10px 12px;
      border-radius: 8px 8px 15px 15px;
      background: radial-gradient(ellipse at 50% 30%, #302b27, #100f0e 72%);
      box-shadow: inset 0 5px 12px #000a;
    }

    .base-frente {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 0;
      height: 15%;
      border: 1px solid #8f744d;
      border-top-color: #c1a273;
      border-radius: 3px 3px 16px 16px;
      background: linear-gradient(180deg, #22201e, #080808 72%);
      transform: translateZ(15px);
    }

    .filete-caixa {
      position: absolute;
      left: 13%;
      right: 13%;
      bottom: 16%;
      height: 2px;
      z-index: 2;
      background: linear-gradient(90deg, transparent, #d0b27d, #f1dfb5, #b2925c, transparent);
      box-shadow: 0 0 9px #d4b47766;
    }

    .tampa-3d {
      position: absolute;
      z-index: 5;
      left: 9%;
      right: 9%;
      top: 4%;
      height: 42%;
      border: 1px solid #8b704b;
      border-radius: 14px 14px 8px 8px;
      background: linear-gradient(145deg, #242220, #090909 58%, #171512);
      box-shadow: inset 0 0 0 5px #ffffff08,
                  inset 0 2px 9px #ffffff12,
                  0 10px 16px #0009;
      transform-origin: 50% 100%;
      transform: rotateX(0);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .tampa-3d::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid #b39360aa;
      border-radius: 9px 9px 5px 5px;
      box-shadow: inset 0 0 14px #0008;
    }

    .tampa-3d::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 26px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(#e5c58e, #80633b);
      transform: translateX(-50%);
      box-shadow: 0 2px 6px #000;
    }

    .anel-berco {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 58%;
      width: 56%;
      transform: translate(-50%, -50%) translateZ(32px) scale(.74);
      opacity: 0;
      filter: drop-shadow(0 0 18px #d9a94b88);
      will-change: transform, opacity;
    }

    .anel-berco svg {
      display: block;
      width: 100%;
      overflow: visible;
    }

    .brilho-joia {
      animation: brilho-joia 2.8s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes brilho-joia {
      0%, 100% { opacity: .72; filter: drop-shadow(0 0 3px #fff4c8); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #fff4c8); }
    }

    .legenda-alianca {
      position: absolute;
      z-index: 4;
      bottom: max(38px, env(safe-area-inset-bottom));
      width: 100%;
      padding: 0 22px;
      text-align: center;
      color: #f0d7ce;
      font-size: clamp(1rem, 2.8vw, 1.3rem);
      opacity: 0;
      transform: translateY(14px);
      text-shadow: 0 2px 12px #000;
      pointer-events: none;
    }

    /* Dissolve a primeira cena enquanto as pétalas entram. */
    #galaxy {
      opacity: calc(1 - var(--scene-fade, 0));
      transition: opacity .12s linear, filter 1.5s ease;
    }

    #warp.on {
      opacity: calc(1 - var(--scene-fade, 0));
      transition: opacity .12s linear;
    }

    .intro:not(.hide) {
      opacity: calc(1 - var(--scene-fade, 0));
      transition: none;
    }

    .card.show {
      opacity: calc(1 - var(--scene-fade, 0));
      transition: opacity .12s linear,
                  transform 1s cubic-bezier(.2,.75,.2,1),
                  visibility 1s;
    }

    body.segunda-parte #galaxy,
    body.segunda-parte #warp,
    body.segunda-parte .intro,
    body.segunda-parte .card {
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .card { padding: 18px; }
      .versiculo { min-height: 120px; }
      .aliancas-sticky { min-height: 520px; }

      .caixa-movimento {
        width: min(290px, 72vw);
        height: min(265px, 60vw);
      }

      .aliancas-titulo { top: 10vh; }
      .legenda-alianca { bottom: max(28px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="galaxy" class="blur" aria-hidden="true"></canvas>
  <canvas id="warp" aria-hidden="true"></canvas>

  <audio id="musica" preload="auto" src="musical.mp3"></audio>

  <section class="intro" id="intro">
    <div>
      <h1>Isto é só para você</h1>

      <button class="entrar" id="entrar" type="button">♥ Toque para entrar</button>
    </div>
  </section>

  <section class="card" id="card" aria-live="polite">
    <p class="kicker">Palavras para o nosso amor</p>
    <figure class="versiculo" id="versiculo"></figure>
    <nav class="nav">
      <button class="arrow" id="prev" type="button" aria-label="Versículo anterior">‹</button>
      <div class="dots" id="dots"></div>
      <button class="arrow" id="next" type="button" aria-label="Próximo versículo">›</button>
    </nav>
    <p class="dica-rolagem">Role para baixo para ver a surpresa ↓</p>
  </section>

  <section id="aliancas" aria-label="Uma surpresa especial">
    <div class="petalas" id="petalas" aria-hidden="true"></div>

    <div class="aliancas-sticky">
      <header class="aliancas-titulo">
        <h2>Nosso próximo capítulo</h2>
        <p>Uma promessa para guardar pertinho do coração…</p>
      </header>

      <div class="caixa-movimento" id="caixaMovimento">
        <div class="caixa-3d">

              <defs>
                <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">

                  <stop offset=".58" stop-color="#d99b22"/>

                  <stop offset=".38" stop-color="#e8f1ff"/>

                  <stop offset="1" stop-color="#fff"/>

                <radialGradient id="reflexo">
                  <stop stop-color="#fff" stop-opacity=".9"/>
                  <stop offset="1" stop-color="#fff" stop-opacity="0"/>

              </defs>

              <ellipse cx="130" cy="131" rx="68" ry="29"

              <path d="M117 77 130 50l14 27-14 17z"

              <path d="M128 39v-15m-9 23-11-10m29 10 11-10"

          <div class="filete-caixa"></div>
          <div class="tampa-3d" id="tampaCaixa"></div>
        </div>
      </div>

      <p class="legenda-alianca" id="legendaAlianca">
        E se a nossa próxima promessa fosse para sempre?
      </p>
    </div>
  </section>

    const poeira = Array.from({ length: 2200 }, () => {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 1350;

      return {
        x: Math.cos(a) * r,
        y: 195 + (Math.random() - .5) * 30,
        z: Math.sin(a) * r,
        size: .55 + Math.random() * 1.3,
        f: Math.random() * 6
      };
    });

    const pontosNome = [];

    for (const camada of [
      { qtd: 32, raio: .97 },
      { qtd: 20, raio: .68 },
      { qtd: 12, raio: .36 }
    ]) {
      for (let i = 0; i < camada.qtd; i++) {
        const a = i / camada.qtd * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(a), 3) / 18;
        const y = -(13 * Math.cos(a) - 5 * Math.cos(2*a) -
          2 * Math.cos(3*a) - Math.cos(4*a)) / 18;

        pontosNome.push({
          x: x * camada.raio,
          y: y * camada.raio,
          f: Math.random() * 6.28,
          z: (Math.random() - .5) * 10
        });
      }
    }

    const estrelasWarp = Array.from({ length: 600 }, () => ({
      a: Math.random() * Math.PI * 2,
      fase: Math.random(),
      velocidade: .6 + Math.random() * .8,
      largura: .6 + Math.random() * 1.6,
      cor: Math.random() < .25 ? "#ffd0a0" :
        (Math.random() < .55 ? "#ff4949" : "#fff4f2")
    }));

    function projetar(x, y, z) {
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const xr = x * cy + z * sy;
      const zr = -x * sy + z * cy;
      const yr = y * cp - zr * sp;
      const zp = y * sp + zr * cp;
      const dist = camera - zp;

      if (dist < 120) return null;

      const s = Math.min(w, h) * 1.2 * zoom / dist;
      return { x: w / 2 + xr * s, y: h / 2 + yr * s, s };
    }

    function redimensionar() {
      w = innerWidth;
      h = innerHeight;

      for (const c of [canvas, warpCanvas]) {
        c.width = w * reducaoDpr;
        c.height = h * reducaoDpr;
        c.style.width = w + "px";
        c.style.height = h + "px";
      }

      ctx.setTransform(reducaoDpr, 0, 0, reducaoDpr, 0, 0);
      wctx.setTransform(reducaoDpr, 0, 0, reducaoDpr, 0, 0);
    }

    function desenharLetra(ms) {
      const segundo = audio.currentTime + AJUSTE_LETRA;
      let indice = -1;

      for (let i = 0; i < LETRA.length; i++) {
        if (segundo >= LETRA[i].tempo) indice = i;
      }

      if (indice !== letraAtual) {
        letraAtual = indice;
        trocaLetra = ms;
      }

      if (indice < 0) return;

      const p = projetar(0, -600, -12);
      if (!p) return;

      const alfa = Math.min(1, (ms - trocaLetra) / 220);

      ctx.save();
      ctx.globalAlpha = alfa;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold " + Math.max(22, Math.min(68, w * .057) * p.s) + "px Georgia";
      ctx.shadowColor = "#ff3030";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "#fff0ed";
      ctx.fillText(LETRA[indice].texto, p.x, p.y, w * .9);
      ctx.restore();
    }

    function desenhar(ms) {
      const t = ms / 1000;
      ctx.clearRect(0, 0, w, h);

      for (const s of estrelas) {
        const p = projetar(s.x, s.y, s.z);
        if (!p || p.x < 0 || p.x > w || p.y < 0 || p.y > h) continue;

        ctx.globalAlpha = s.a * (.78 + .22 * Math.sin(t * .35 + s.f));
        ctx.fillStyle = "#ffe9e6";
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(.35, s.r * p.s * .8), 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < poeira.length; i++) {
        const q = poeira[i], a = t * .018;
        const x = Math.cos(a) * q.x + Math.sin(a) * q.z;
        const z = -Math.sin(a) * q.x + Math.cos(a) * q.z;
        const p = projetar(x, q.y, z);

        if (!p || p.x < -3 || p.x > w + 3 || p.y < -3 || p.y > h + 3) continue;

        ctx.globalAlpha = (.32 + .48 * (.5 + .5 * Math.sin(t * .4 + q.f))) * Math.min(1, p.s);
        ctx.fillStyle = i % 7 === 0 ? "#ff4949" : "#ffe6e2";
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(.45, q.size * p.s * .8), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      const centro = projetar(0, 195, 0);

      if (centro) {
        const raio = Math.min(w * .48, 650) * centro.s;

        ctx.save();
        ctx.translate(centro.x, centro.y);
        ctx.scale(1, .27);

        const brilho = ctx.createRadialGradient(0, 0, 2, 0, 0, raio);
        brilho.addColorStop(0, "#fff5d8");
        brilho.addColorStop(.08, "#ffd08a");
        brilho.addColorStop(.18, "#ed2939");
        brilho.addColorStop(1, "rgba(220,20,40,0)");

        ctx.fillStyle = brilho;
        ctx.beginPath();
        ctx.arc(0, 0, raio, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const pulso = 1 + .008 * Math.sin(t * .32);

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "#ff2828";
      ctx.shadowBlur = 13;

      for (let i = 0; i < pontosNome.length; i++) {
        const q = pontosNome[i];
        const p = projetar(q.x * 350 * pulso, -205 + q.y * 320 * pulso, q.z);
        if (!p) continue;

        ctx.globalAlpha = .76 + .12 * Math.sin(t * .28 + q.f);
        ctx.fillStyle = i % 9 === 0 ? "#fff0d0" : "#ffe6e2";
        ctx.font = "bold " + Math.max(8, Math.min(15, 13 * p.s)) + "px Georgia";
        ctx.fillText(NOME, p.x, p.y);
      }

      ctx.restore();
      ctx.globalAlpha = 1;

      desenharLetra(ms);
      requestAnimationFrame(desenhar);
    }

    function easeOut(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function desenharWarp(ms) {
      if (warpStart === null) return;

      const decorrido = ms - warpStart;
      const progresso = Math.min(decorrido / 3800, 1);
      const velocidade = progresso * progresso * progresso;
      const centroX = w / 2, centroY = h * .4;
      const raioMax = Math.hypot(w, h) * .75;

      wctx.clearRect(0, 0, w, h);
      wctx.lineCap = "round";

      for (const s of estrelasWarp) {
        const k = (s.fase + decorrido / 1000 *
          (.25 + 1.8 * velocidade) * s.velocidade) % 1;
        const r1 = Math.pow(k, 2.2) * raioMax;
        const r0 = Math.pow(Math.max(0, k - (.05 + .25 * velocidade)), 2.2) * raioMax;
        const fade = progresso > .85 ? (1 - progresso) / .15 : 1;

        wctx.globalAlpha = Math.min(1, k * 3) * Math.min(1, (1-k) * 6) * fade;
        wctx.strokeStyle = s.cor;
        wctx.lineWidth = s.largura * (.5 + 1.5 * velocidade);
        wctx.beginPath();
        wctx.moveTo(centroX + Math.cos(s.a) * r0, centroY + Math.sin(s.a) * r0);
        wctx.lineTo(centroX + Math.cos(s.a) * r1, centroY + Math.sin(s.a) * r1);
        wctx.stroke();
      }

      if (progresso > .9) {
        wctx.globalAlpha = (progresso - .9) * 2.4;
        wctx.fillStyle = "#ffe0df";
        wctx.fillRect(0, 0, w, h);
      }

      wctx.globalAlpha = 1;
      zoom = .3 + .7 * easeOut(progresso);

      if (progresso < 1) {
        requestAnimationFrame(desenharWarp);
      } else {
        warpStart = null;
        zoom = 1;
        wctx.clearRect(0, 0, w, h);
        warpCanvas.classList.remove("on");
        canvas.classList.remove("blur");
        card.classList.add("show");
      }
    }

    function mostrarVersiculo(indice) {
      versoAtual = (indice + VERSICULOS.length) % VERSICULOS.length;
      const v = VERSICULOS[versoAtual];

      versoEl.classList.add("trocando");

      setTimeout(() => {
        versoEl.innerHTML =
          "<blockquote>“" + v.texto + "”</blockquote><figcaption>" +
          v.ref + "</figcaption>";

        versoEl.classList.remove("trocando");

        [...dotsEl.children].forEach((d, i) =>
          d.classList.toggle("on", i === versoAtual)
        );
      }, 180);
    }

    VERSICULOS.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "dot";
      dot.setAttribute("aria-label", "Versículo " + (i + 1));
      dot.addEventListener("click", () => mostrarVersiculo(i));
      dotsEl.append(dot);
    });

    document.getElementById("prev").addEventListener("click", () =>
      mostrarVersiculo(versoAtual - 1)
    );

    document.getElementById("next").addEventListener("click", () =>
      mostrarVersiculo(versoAtual + 1)
    );

    document.getElementById("entrar").addEventListener("click", () => {
      if (warpStart !== null) return;

      intro.classList.add("hide");
      audio.currentTime = 0;
      audio.play().catch(() => {});

      warpStart = performance.now();
      warpCanvas.classList.add("on");
      requestAnimationFrame(desenharWarp);
    });

    const pointers = new Map();
    let distanciaPinch = 0;

    canvas.addEventListener("pointerdown", e => {
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        drag = { x: e.clientX, y: e.clientY };
      }

      if (pointers.size === 2) {
        const p = [...pointers.values()];
        distanciaPinch = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
        drag = null;
      }
    });

    canvas.addEventListener("pointermove", e => {
      if (!pointers.has(e.pointerId)) return;

      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size >= 2) {
        const p = [...pointers.values()];
        const distancia = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);

        if (distanciaPinch) {
          zoom = Math.max(.65, Math.min(1.9, zoom * distancia / distanciaPinch));
        }

        distanciaPinch = distancia;
      } else if (drag) {
        yaw += (e.clientX - drag.x) * .004;
        pitch = Math.max(-.15, Math.min(1.05, pitch + (e.clientY - drag.y) * .004));
        drag = { x: e.clientX, y: e.clientY };
      }
    });

    function soltar(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) distanciaPinch = 0;
      if (!pointers.size) drag = null;
    }

    canvas.addEventListener("pointerup", soltar);
    canvas.addEventListener("pointercancel", soltar);

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      zoom = Math.max(.65, Math.min(1.9, zoom * Math.exp(-e.deltaY * .001)));
    }, { passive: false });

    document.addEventListener("keydown", e => {
      if (!card.classList.contains("show")) return;
      if (e.key === "ArrowRight") mostrarVersiculo(versoAtual + 1);
      if (e.key === "ArrowLeft") mostrarVersiculo(versoAtual - 1);
    });

    // Mais pétalas, distribuídas por toda a cena.
    const petalasEl = document.getElementById("petalas");

    for (let i = 0; i < 100; i++) {
      const petala = document.createElement("i");
      petala.className = "petala";
      petala.style.setProperty("--left", Math.random() * 100 + "%");
      petala.style.setProperty("--size", 10 + Math.random() * 18 + "px");
      petala.style.setProperty("--duration", 28 + Math.random() * 12 + "s");
      petala.style.setProperty("--delay", -Math.random() * 40 + "s");
      petala.style.setProperty("--drift", (Math.random() - .5) * 210 + "px");
      petala.style.setProperty("--spin", 300 + Math.random() * 700 + "deg");
      petala.style.setProperty("--opacity", (.45 + Math.random() * .45).toFixed(2));
      petala.style.setProperty("--softness", Math.random() * .7 + "px");
      petalasEl.appendChild(petala);
    }

    const secaoAliancas = document.getElementById("aliancas");
    const caixaMovimento = document.getElementById("caixaMovimento");
    const tampaCaixa = document.getElementById("tampaCaixa");
    const anelBerco = document.getElementById("anelBerco");
    const legendaAlianca = document.getElementById("legendaAlianca");

    function atualizarCenaAlianca() {
      const rect = secaoAliancas.getBoundingClientRect();
      const faixaAnimacao = Math.max(1, secaoAliancas.offsetHeight - innerHeight);
      const progresso = Math.max(0, Math.min(1, -rect.top / faixaAnimacao));

      // Curva suave, sem mudanças bruscas de velocidade.
      const suave = progresso * progresso * (3 - 2 * progresso);

      // A caixa chega ao centro logo no começo da segunda cena.
      const viagemBruta = Math.max(0, Math.min(1, suave / .22));
      const viagem = viagemBruta * viagemBruta * (3 - 2 * viagemBruta);

      // A tampa abre perto do final da rolagem.
      const aberturaBruta = Math.max(0, Math.min(1, (suave - .72) / .20));
      const abertura = aberturaBruta * aberturaBruta * (3 - 2 * aberturaBruta);

      const x = 40 * (1 - viagem);
      const y = 80 * (1 - viagem);
      const escala = .9 + .12 * viagem;

      caixaMovimento.style.opacity = "1";
      caixaMovimento.style.transform =
        `translate3d(calc(-50% + ${x}vw), calc(-50% + ${y}vh), 0) scale(${escala})`;

      tampaCaixa.style.transform = `rotateX(${-190 * abertura}deg)`;

      // O anel sobe para a frente da base para continuar visível com a tampa aberta.
      const mostrarAnel = Math.max(0, Math.min(1, (abertura - .12) / .56));
      anelBerco.style.opacity = mostrarAnel;
      anelBerco.style.transform =
        `translate(-50%, -50%) translateZ(32px) scale(${.74 + mostrarAnel * .24})`;

      const legenda = Math.max(0, Math.min(1, (suave - .84) / .08));
      legendaAlianca.style.opacity = legenda;
      legendaAlianca.style.transform = `translateY(${14 - 14 * legenda}px)`;

      // A primeira cena se dissolve enquanto a segunda entra.
      const faixaTransicao = Math.max(1, innerHeight * .55);
      const transicao = Math.max(
        0,
        Math.min(1, (faixaTransicao - rect.top) / faixaTransicao)
      );
      const transicaoSuave = transicao * transicao * (3 - 2 * transicao);

      document.body.style.setProperty("--scene-fade", transicaoSuave.toFixed(3));
      document.body.classList.toggle("segunda-parte", transicaoSuave > .98);

      // Ao voltar a rolar para cima, a cena volta ao comportamento normal.
      secaoAliancas.classList.toggle("aliancas-finalizada", progresso >= .999);
    }

    let scrollPendente = false;

    window.addEventListener("scroll", () => {
      if (scrollPendente) return;
      scrollPendente = true;

      requestAnimationFrame(() => {
        scrollPendente = false;
        atualizarCenaAlianca();
      });
    }, { passive: true });

    window.addEventListener("resize", atualizarCenaAlianca);
    window.addEventListener("resize", redimensionar);

    atualizarCenaAlianca();
    redimensionar();
    mostrarVersiculo(0);
    requestAnimationFrame(desenhar);
  </script>
</body>
</html>
